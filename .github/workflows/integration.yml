name: Integration

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # Building isn't strictly necessary for running the integration tests, but
      # it ensures the deployable command compiles independently.
      - name: Build the application
        run: go build -o tls-client-scanner ./cmd/tls-client-scanner
          
      - name: Run tests
        run: go test -race ./...
